# UEFI compatibility: retain the firmware's display mode and use EFI LoadImage
# for a bundled kernel/initrd instead of GRUB's Linux loader and relocation.
loadfont $prefix/font.pf2
set gfxmode=auto
set gfxpayload=keep
insmod all_video
insmod gfxterm
terminal_output gfxterm
loadfont /boot/grub/kindred.pf2
set theme=/boot/grub/kindred-theme.txt
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-green
set timeout=-1
set default=0

menuentry 'Install Kindred OS' {
    echo 'Starting Kindred installer (EFI compatibility)...'
    if chainloader /kindred/install.efi; then
        boot
    fi
    echo 'EFI installer returned. Photograph any error above.'
    echo 'Press Enter to return to the Kindred menu.'
    read
}
menuentry 'Kindred OS - repair an existing installation' {
    echo 'Starting Kindred repair (EFI compatibility)...'
    if chainloader /kindred/repair.efi; then
        boot
    fi
    echo 'EFI repair returned. Photograph any error above.'
    echo 'Press Enter to return to the Kindred menu.'
    read
}
menuentry 'Turn off computer' {
    halt
}
