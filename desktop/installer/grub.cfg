loadfont $prefix/font.pf2
set gfxmode=1024x768,auto
# Preserve the firmware framebuffer through the EFI Linux handoff, as Debian does.
set gfxpayload=keep
insmod all_video
insmod gfxterm
terminal_output gfxterm
loadfont /boot/grub/kindred.pf2
set theme=/boot/grub/kindred-theme.txt
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-green
set timeout=-1
set default=0
# vga= is a legacy BIOS mode selector, not an EFI GOP mode selector.
set installer_video=
if [ "$grub_platform" = "pc" ]; then
    set installer_video=vga=788
fi
menuentry 'Install Kindred OS' {
    linux /install.amd/vmlinuz auto=true priority=high $installer_video --- quiet
    initrd /install.amd/initrd.gz
}
menuentry 'Kindred OS - repair an existing installation' {
    linux /install.amd/vmlinuz rescue/enable=true priority=low $installer_video ---
    initrd /install.amd/rescue.gz
}
menuentry 'Turn off computer' {
    halt
}
