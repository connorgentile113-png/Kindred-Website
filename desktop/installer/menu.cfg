menu title Kindred OS - Welcome home
menu background
menu color title 1;37;40 #ffffffff #ff172b24 none
menu color sel 0;30;47 #ff172b24 #ffa5dfb7 none
menu color unsel 0;37;40 #ffffffff #ff172b24 none
label kindred
  menu label Install Kindred OS
  menu default
  kernel /install.amd/vmlinuz
  append initrd=/install.amd/initrd.gz auto=true priority=high vga=788 --- quiet
label rescue
  menu label Kindred OS - repair an existing installation
  kernel /install.amd/vmlinuz
  append initrd=/install.amd/rescue.gz rescue/enable=true priority=low ---
label poweroff
  menu label Turn off computer
  com32 /isolinux/poweroff.c32
